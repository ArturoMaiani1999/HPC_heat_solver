[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-hpc"
version = "0.1.0"
description = "Multi-GPU heat equation solver (single + distributed) for HPC learning."
readme = "README.md"
requires-python = ">=3.9"

license = { text = "MIT" }
authors = [{ name = "Arturo Maiani" }]
keywords = ["hpc", "cuda", "nccl", "pytorch", "stencil", "pde"]

dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
